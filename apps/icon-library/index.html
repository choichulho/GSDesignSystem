<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GS Icon Library</title>
<style>
  :root {
    /* GS Design System — Semantic: Color (Light) */
    --bg: #FFFFFF;            /* background/default/primary */
    --surface: #F9FAFC;       /* background/default/secondary */
    --text: #191923;          /* text/default/primary */
    --text-2: #424252;        /* text/default/secondary */
    --muted: #5C5C70;         /* text/default/tertiary */
    --placeholder: #9595B2;   /* text/default/placeholder */
    --hover: #F5F6FA;         /* background/neutral/subtle */
    --sel: #ECF4FE;           /* background/brand/subtle */
    --sel-ring: #0A61EB;      /* border/selected/default */
    --border: #EAECF5;        /* border/default/secondary */
    --border-strong: #D2D4E5; /* border/default/primary */
    --brand: #0F78FF;         /* background/brand/default */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ── Toggle (상단 중앙) ── */
  .toggle-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
  .toggle { display: inline-flex; background: var(--hover); border-radius: 999px; padding: 5px; }
  .toggle button {
    border: none; background: transparent; padding: 9px 26px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: .15s;
  }
  .toggle button.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* ── Search ── */
  .search {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 22px; box-shadow: 0 2px 10px rgba(0,0,0,.03);
  }
  .search:focus-within { border-color: var(--border-strong); }
  .search svg { flex: none; color: var(--muted); }
  .search input { border: none; outline: none; font-size: 16px; width: 100%; background: transparent; color: var(--text); }
  .search input::placeholder { color: var(--placeholder); }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }

  /* ── Category chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 22px 0 6px; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: var(--text-2);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: .12s;
  }
  .chip:hover { border-color: var(--border-strong); }
  .chip.active { background: var(--text); color: #fff; border-color: var(--text); }
  .count { color: var(--muted); font-size: 13px; margin: 16px 2px 12px; }

  /* ── Grid (테두리 없음, hover 배경) ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .cell {
    aspect-ratio: 1; background: transparent; border: 0.5px solid #EAECF5; border-radius: 14px;
    cursor: pointer; display: grid; place-items: center; transition: .12s; color: var(--text); padding: 0;
  }
  .cell:hover { background: var(--hover); border-color: var(--border-strong); }
  .cell.selected { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--sel-ring); }
  .cell .ico svg { width: 26px; height: 26px; display: block; }

  .empty, .loading { color: var(--muted); font-size: 14px; padding: 60px 0; text-align: center; }

  /* ── Detail drawer ── */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .2s; z-index: 29; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 400px; max-width: 92vw;
    background: #fff; box-shadow: -10px 0 40px rgba(0,0,0,.1);
    transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
    z-index: 30; display: flex; flex-direction: column; overflow: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .close { position: absolute; top: 16px; right: 16px; border: none; background: var(--hover); border-radius: 9px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: var(--muted); }
  .drawer .close:hover { background: var(--border); }
  .preview {
    display: grid; place-items: center; padding: 52px 40px 44px;
    background:
      linear-gradient(45deg, #f4f4f6 25%, transparent 25%, transparent 75%, #f4f4f6 75%),
      linear-gradient(45deg, #f4f4f6 25%, #fff 25%, #fff 75%, #f4f4f6 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  .preview .ico svg { width: 56px; height: 56px; display: block; color: var(--text); }
  .dbody { padding: 22px 22px 30px; }
  .dbody h2 { font-size: 15px; margin: 0 0 5px; font-family: var(--mono); word-break: break-all; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .tag { background: var(--hover); color: var(--text-2); border-radius: 6px; padding: 4px 9px; font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { border: none; background: transparent; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 7px; }
  .tabs button.active { color: var(--text); background: var(--hover); }
  .code {
    position: relative; background: #16161a; border-radius: 11px; padding: 14px 15px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: #e6e6ea;
    white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto;
  }
  .copy { position: absolute; top: 9px; right: 9px; border: none; background: #2c2c33; color: #cfcfd6; border-radius: 7px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .copy:hover { background: #3a3a43; }
  .copy.done { background: #1f7a4d; color: #fff; }

  @media (max-width: 620px) {
    .drawer { top: auto; bottom: 0; right: 0; width: 100%; max-width: 100%; height: auto; max-height: 82vh;
      border-radius: 18px 18px 0 0; transform: translateY(101%); }
    .drawer.open { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="toggle-wrap">
      <div class="toggle" id="toggle">
        <button data-type="monochrome" class="active">Monochrome</button>
        <button data-type="multicolor">Multicolor</button>
      </div>
    </div>

    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="person, car, 알파벳, etc..." autocomplete="off" />
    </label>
    <div class="hint">아이콘을 검색해보세요.</div>

    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="loading" id="loading">아이콘을 불러오는 중…</div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <button class="close" id="close" aria-label="닫기">✕</button>
    <div class="preview"><span class="ico" id="pvIco"></span></div>
    <div class="dbody">
      <h2 id="pvName"></h2>
      <div class="meta" id="pvMeta"></div>
      <div class="tags" id="pvTags"></div>
      <div class="tabs" id="tabs">
        <button data-tab="react" class="active">React</button>
        <button data-tab="vue">Vue</button>
        <button data-tab="flutter">Flutter</button>
        <button data-tab="svg">SVG</button>
      </div>
      <div class="code"><button class="copy" id="copyBtn">복사</button><span id="codeText"></span></div>
    </div>
  </aside>

<script>
// ─────────────────────────────────────────────
//  ⚙️ 설정 — icons.json 위치. 저장소 이름이 바뀌면 여기만 수정하세요.
const ICONS_JSON_URL = "https://raw.githubusercontent.com/choichulho/GSDesignSystem/main/packages/icons/icons.json";
// ─────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
let ALL = [];
const state = { q: "", cat: "all", type: "monochrome", selected: null, tab: "react" };

const pascal = (name) =>
  name.split(/[_-]/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join("");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// 보안: 아이콘 SVG를 화면에 삽입하기 전에 스크립트·이벤트 핸들러를 제거 (XSS 방어)
function sanitizeSvg(str) {
  if (!str) return "";
  const doc = new DOMParser().parseFromString(str, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.nodeName === "parsererror") return "";
  root.querySelectorAll("script, foreignObject").forEach((n) => n.remove());
  root.querySelectorAll("*").forEach((el) => {
    [...el.attributes].forEach((a) => {
      const n = a.name.toLowerCase();
      const isEvent = n.startsWith("on");
      const isJsHref = /href$/i.test(n) && /^\s*javascript:/i.test(a.value);
      if (isEvent || isJsHref) el.removeAttribute(a.name);
    });
  });
  return root.outerHTML;
}

fetch(ICONS_JSON_URL)
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => {
    ALL = data.icons || [];
    // multicolor가 하나도 없으면 기본 필터를 전체로
    if (!ALL.some((i) => i.type === "multicolor")) { state.type = "all"; $("toggle").style.display = "none"; }
    $("loading").style.display = "none";
    buildChips();
    render();
    const initial = new URLSearchParams(location.search).get("icon");
    if (initial) { const ic = ALL.find((i) => i.name === initial); if (ic) { syncTypeFor(ic); render(); select(ic); } }
  })
  .catch((err) => {
    $("loading").innerHTML = "아이콘을 불러오지 못했습니다.<br><small>" + esc(String(err)) + "<br>icons.json 주소를 확인하세요.</small>";
  });

function buildChips() {
  const cats = ["all", ...Array.from(new Set(ALL.map((i) => i.category))).sort()];
  const wrap = $("chips");
  cats.forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip" + (c === "all" ? " active" : "");
    b.textContent = c === "all" ? "전체" : c;
    b.onclick = () => { state.cat = c; [...wrap.querySelectorAll(".chip")].forEach((x) => x.classList.remove("active")); b.classList.add("active"); render(); };
    wrap.appendChild(b);
  });
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return ALL.filter((ic) => {
    if (state.type !== "all" && ic.type !== state.type) return false;
    if (state.cat !== "all" && ic.category !== state.cat) return false;
    if (!q) return true;
    const hay = (ic.name + " " + ic.id + " " + (ic.keywords || []).join(" ") + " " + ic.category).toLowerCase();
    return hay.includes(q);
  });
}

function render() {
  const list = filtered();
  $("count").textContent = list.length + "개 아이콘";
  const grid = $("grid");
  grid.innerHTML = "";
  if (!list.length) { grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }
  const frag = document.createDocumentFragment();
  for (const ic of list) {
    const b = document.createElement("button");
    b.className = "cell" + (state.selected && state.selected.name === ic.name ? " selected" : "");
    b.title = ic.name;
    b.innerHTML = '<span class="ico">' + sanitizeSvg(ic.svg) + "</span>";
    b.onclick = () => select(ic);
    frag.appendChild(b);
  }
  grid.appendChild(frag);
}

function codeFor(ic, tab) {
  const comp = pascal(ic.name);
  if (tab === "react") return 'import { ' + comp + ' } from "@gs/icons-react";\n\n<' + comp + " />";
  if (tab === "vue") return 'import { ' + comp + ' } from "@gs/icons-vue";\n\n<' + comp + ' :size="24" />';
  if (tab === "flutter") {
    const tail = ic.type === "multicolor"
      ? ",\n)"
      : ",\n  colorFilter: const ColorFilter.mode(Color(0xFF191923), BlendMode.srcIn), // 색 변경\n)";
    return "// pubspec.yaml → dependencies: flutter_svg: ^2.0.0\n" +
      "import 'package:flutter_svg/flutter_svg.dart';\n\n" +
      "SvgPicture.string(\n  '''" + (ic.svg || "") + "''',\n  width: 24,\n  height: 24" + tail;
  }
  return ic.svg || "";
}

function syncTypeFor(ic) {
  // 딥링크로 들어온 아이콘의 타입에 맞춰 토글 상태 맞추기
  if (state.type !== "all" && ic.type && ic.type !== state.type) {
    state.type = ic.type;
    [...$("toggle").children].forEach((b) => b.classList.toggle("active", b.dataset.type === ic.type));
  }
}

function select(ic) {
  state.selected = ic;
  $("drawer").classList.add("open");
  $("backdrop").classList.add("open");
  $("pvIco").innerHTML = sanitizeSvg(ic.svg);
  $("pvName").textContent = ic.name;
  $("pvMeta").textContent = [ic.category, ic.type, ic.weight].filter(Boolean).join(" · ");
  $("pvTags").innerHTML = (ic.keywords || []).map((k) => '<span class="tag">' + esc(k) + "</span>").join("");
  paintCode();
  [...document.querySelectorAll(".cell")].forEach((c) => c.classList.toggle("selected", c.title === ic.name));
  history.replaceState(null, "", "?icon=" + encodeURIComponent(ic.name));
}

function closeDrawer() {
  $("drawer").classList.remove("open");
  $("backdrop").classList.remove("open");
  state.selected = null;
  [...document.querySelectorAll(".cell")].forEach((c) => c.classList.remove("selected"));
  history.replaceState(null, "", location.pathname);
}

function paintCode() {
  if (!state.selected) return;
  $("codeText").innerHTML = esc(codeFor(state.selected, state.tab));
  const cb = $("copyBtn"); cb.textContent = "복사"; cb.classList.remove("done");
}

$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("toggle").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  state.type = e.target.dataset.type;
  [...$("toggle").children].forEach((b) => b.classList.toggle("active", b === e.target));
  render();
});
$("tabs").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  state.tab = e.target.dataset.tab;
  [...$("tabs").children].forEach((b) => b.classList.toggle("active", b === e.target));
  paintCode();
});
$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(codeFor(state.selected, state.tab));
    const cb = $("copyBtn"); cb.textContent = "복사됨 ✓"; cb.classList.add("done");
    setTimeout(() => { cb.textContent = "복사"; cb.classList.remove("done"); }, 1400);
  } catch (e) {}
});
$("close").addEventListener("click", closeDrawer);
$("backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
</script>
</body>
</html>
