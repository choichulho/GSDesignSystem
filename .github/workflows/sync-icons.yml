name: Sync Icons from Figma

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 세팅
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node 세팅
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install

      - name: 피그마 → SVG + icons.json
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm --filter @gsds/icons export

      - name: SVG → React·Vue 컴포넌트
        run: pnpm --filter @gsds/icons build

      - name: icons.json → 아이콘 폰트 생성 (css + woff/woff2/ttf)
        run: pnpm --filter @gsds/icons font

      - name: icons.json → apps/docs 정적 복사본 동기화
        run: cp packages/icons/icons.json apps/docs/public/icons.json

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "gs-icon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/icons apps/docs/public/icons.json
          if git diff --staged --quiet; then
            echo "변경된 아이콘이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "chore(icons): 피그마 아이콘 동기화 [skip ci]"
            git push
          fi
