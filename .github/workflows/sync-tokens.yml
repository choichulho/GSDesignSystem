name: Sync Tokens from Figma

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 세팅
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node 세팅
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install

      - name: 피그마 Variables → tokens.json
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm --filter @gsds/tokens export

      - name: tokens.json → CSS 변수
        run: pnpm --filter @gsds/tokens build

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "gs-token-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tokens
          if git diff --staged --quiet; then
            echo "변경된 토큰이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "chore(tokens): 피그마 토큰 동기화 [skip ci]"
            git push
          fi
